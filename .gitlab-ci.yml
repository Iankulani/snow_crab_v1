# SNOW-CRAB-V1 GitLab CI/CD Pipeline

stages:
  - validate
  - test
  - build
  - security
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache configuration
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - venv/
    - .snow_crab_v1/

# ==================== VALIDATE STAGE ====================

python-syntax-check:
  stage: validate
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install pyflakes pylint
  script:
    - echo "Checking Python syntax..."
    - python -m py_compile snow_crab_v1.py 2>/dev/null || echo "Main script syntax check skipped"
    - echo "Running pyflakes..."
    - pyflakes *.py 2>/dev/null || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

yaml-lint:
  stage: validate
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install yamllint
  script:
    - yamllint .gitlab-ci.yml docker-compose.yml 2>/dev/null || true
  allow_failure: true

markdown-lint:
  stage: validate
  image: node:18-alpine
  script:
    - npx markdownlint-cli README.md 2>/dev/null || true
  allow_failure: true

# ==================== TEST STAGE ====================

requirements-check:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python requirements-check.py

unit-tests:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - apt-get update && apt-get install -y nmap curl netcat-openbsd dnsutils traceroute whois openssh-client
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - pytest test-commands.py -v --cov=. --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
  allow_failure: true

integration-tests:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - apt-get update && apt-get install -y nmap curl netcat-openbsd dnsutils
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -c "from snow_crab_v1 import DatabaseManager, CommandHandler; db = DatabaseManager('test.db'); h = CommandHandler(db); print(h.execute('help')['success'])"
  allow_failure: true

# ==================== BUILD STAGE ====================

build-docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - echo "Pushing Docker image..."
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

build-docker-alpine:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Alpine Docker image..."
    - docker build -f Dockerfile.alpine -t $DOCKER_IMAGE:$DOCKER_TAG-alpine -t $DOCKER_IMAGE:alpine .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG-alpine
    - docker push $DOCKER_IMAGE:alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

build-package:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install build twine
  script:
    - python -m build
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

# ==================== SECURITY STAGE ====================

sast:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install bandit
  script:
    - bandit -r . -f json -o bandit-report.json || true
    - bandit -r . -f txt || true
  artifacts:
    paths:
      - bandit-report.json
  allow_failure: true

dependency-scanning:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install safety
  script:
    - safety check -r requirements.txt --json > safety-report.json || true
    - safety check -r requirements.txt || true
  artifacts:
    paths:
      - safety-report.json
  allow_failure: true

container-scanning:
  stage: security
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Container scanning would go here (using Trivy or similar)"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ==================== DEPLOY STAGE ====================

deploy-staging:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging..."
    - ssh $STAGING_USER@$STAGING_HOST "cd /opt/snow-crab && git pull && docker-compose down && docker-compose up -d --build"
  environment:
    name: staging
    url: https://staging.snowcrab.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy-production:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh $PROD_USER@$PROD_HOST "cd /opt/snow-crab && git pull && docker-compose down && docker-compose up -d --build"
  environment:
    name: production
    url: https://snowcrab.example.com
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==================== RELEASE ====================

create-release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --description "SNOW-CRAB-V1 Release $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# ==================== PAGES ====================

pages:
  stage: deploy
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install sphinx sphinx-rtd-theme
  script:
    - mkdir -p public
    - echo "Documentation" > public/index.html
    - cp README.md public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
