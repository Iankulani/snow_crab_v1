# =============================================================================
# SNOW-CRAB-V1 GitLab CI/CD Pipeline — Simple Alpine
# =============================================================================

stages:
  - validate
  - test
  - build
  - security
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

# -----------------------------------------------------------------------------
# VALIDATE
# -----------------------------------------------------------------------------

python-syntax-check:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
  script:
    - python3 -m py_compile snow_crab_v1.py || echo "syntax check skipped"
    - python3 -m pyflakes *.py || true
  allow_failure: true

yaml-lint:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip py3-yamllint
  script:
    - yamllint .gitlab-ci.yml || true
  allow_failure: true

# -----------------------------------------------------------------------------
# TEST
# -----------------------------------------------------------------------------

unit-tests:
  stage: test
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip python3-dev py3-virtualenv build-base libffi-dev openssl-dev
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt pytest pytest-cov
  script:
    - pytest test-commands.py -v --cov=. --cov-report=term || true
  coverage: '/TOTAL.*\s+(\d+)%/'
  allow_failure: true

# -----------------------------------------------------------------------------
# BUILD
# -----------------------------------------------------------------------------

build-docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile.alpine -t "$DOCKER_IMAGE:$DOCKER_TAG-alpine" -t "$DOCKER_IMAGE:alpine" .
    - docker push "$DOCKER_IMAGE:$DOCKER_TAG-alpine"
    - docker push "$DOCKER_IMAGE:alpine"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# SECURITY
# -----------------------------------------------------------------------------

sast:
  stage: security
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
  script:
    - pip install --break-system-packages bandit
    - bandit -r . -x ./venv,./.venv -f txt || true
  allow_failure: true

dependency-scanning:
  stage: security
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
  script:
    - pip install --break-system-packages safety
    - safety check -r requirements.txt || true
  allow_failure: true

# -----------------------------------------------------------------------------
# DEPLOY
# -----------------------------------------------------------------------------

deploy-staging:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh "$STAGING_USER@$STAGING_HOST" "cd /opt/snow-crab && git pull && docker compose up -d --build"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy-production:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh "$PROD_USER@$PROD_HOST" "cd /opt/snow-crab && git pull && docker compose up -d --build"
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
